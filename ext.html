<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, "initial-scale=1.0">
    <title>Hotel Room Booking System </title>
    <style>
        body{
            background-color:lightblue;
            font-family:Arial;
        }
        h1{
            text-align:center;
            color:darkblue;

        }
        form{
            background-color:white;
            width:350px;
            padding:20px;
            margin:auto;
            border:2px solid black;
            border-radius:10px;
        }
        label {
            font-weight:bold;

        }
        input,select{
            width:100%;
            padding:5%;
            margin:5ps 0;
        }
        input [type="submit"] {
            background-color:green;
            color:white;
            padding:8px;
            border:none;
        }
        input [type="reset"] {
            background-color:red;
            color:white;
            padding:8px;
            border:none;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Hotel Room Booking System </h1>  
  <form style="text-align:center;">
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" name="full name " placeholder="Enter your Full Name"><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

    <label for="checkIn">Check-in Date:</label>
    <input type="date" id="checkIn" name="checkIn"><br><br>

    <label for="checkOut">Check-out Date:</label>
    <input type="date" id="checkOut" name="checkOut"><br><br>

    <label for="roomType">Room Type:</label>
    <select id="roomType" name="roomType">
        <option value="single">Single</option>
        <option value="double">Double</option>
        <option value="suite">Suite</option>
    </select><br><br>

    <label for="guests"> Number of Guests :</label>
    <input type="number" id="guests" name="guests" min="1" max="10"><br><br>

    <input type="submit" value="Book Now">
    <input type="reset" value="Reset">


  </form>
</body>
</html>
